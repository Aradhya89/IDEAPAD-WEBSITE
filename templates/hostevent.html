<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Page</title>
    <style>
        div{
            margin:20px;
        }
    </style>
</head>
<body>

 <form method="POST"
          enctype="multipart/form-data"
          class="space-y-6 bg-white p-6 md:p-8
                 rounded-2xl shadow-sm border border-gray-200">

        <div>
            <label for="title"
                   class="block font-semibold mb-2">
                Event Title
            </label>

            <input type="text"
                   id="title"
                   name="title"
                   required
                   maxlength="200"
                   class="w-full border rounded-xl p-3"
                   placeholder="AI Innovation Challenge">
        </div>

        <div>
            <label for="banner"
                   class="block font-semibold mb-2">
                Event Banner
            </label>

            <input type="file"
                   id="banner"
                   name="banner"
                   accept="image/jpeg,image/png,image/webp"
                   required
                   class="w-full border rounded-xl p-3">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label for="date"
                       class="block font-semibold mb-2">
                    Event Date
                </label>

                <input type="date"
                       id="date"
                       name="date"
                       required
                       class="w-full border rounded-xl p-3">
            </div>

            <div>
                <label for="time"
                       class="block font-semibold mb-2">
                    Start Time
                </label>

                <input type="time"
                       id="time"
                       name="time"
                       required
                       class="w-full border rounded-xl p-3">
            </div>
        </div>

        <div>
            <label for="description"
                   class="block font-semibold mb-2">
                Event Description
            </label>

            <textarea id="description"
                      name="description"
                      rows="5"
                      required
                      class="w-full border rounded-xl p-3"
                      placeholder="Describe the event..."></textarea>
        </div>

        <button type="submit"
                class="bg-[#ef233c] hover:bg-red-700
                       text-white font-bold py-4 rounded-xl
                       transition-colors">
            Create Event
        </button>

    </form>
    
</body>
</html>
