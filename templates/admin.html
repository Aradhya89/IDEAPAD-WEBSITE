<!DOCTYPE html>
<html lang="en"> 

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL</title>
    <style>
        body {
            background-color: grey;
            color: white;

        }

        .button {
            background-color: aqua;
            padding: 10px;
            margin: 10px;
            border-radius: 20px;
            color: black;
            border-bottom: 2px white solid;
        }

        main {
            display: flex;
            justify-content: space-around;
            gap: 30px;
        }

        #underproduction {
            background-color: rgb(235, 183, 183);
            cursor:not-allowed;
        }

        .element {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dropdownbox {
            background-color: aqua;
            padding:10px;
            border-radius: 10px;
            display: flex; flex-direction: column; gap:5px;
        }
        .item {
            background-color: rgb(167, 202, 255);
            padding: 4px;
            border-radius: 10px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    
    <main>
        <div class="element">
            <button id = "listbtn"  class="button" 
                >Registration List</button>
            
            <div class = "dropdownbox hidden" id = "menu">
                {% for data in event_data %}
                <a class = "item" href = /admin/list/{{data.id}}>{{data.title}}</a>
                {% endfor %}
            </div>

        </div>

        <div class="element">
            <button onclick = "window.open('https://reportmakerip.up.railway.app/','_blank')" class = "button">Report Maker</button>
            password = "IDEAPAD"
        </div>

        <div class="element">
            <button onclick="window.location.href='/admin/team'" class="button" disabled id="underproduction"> Team Formation</button>
                        Under Development
        </div>
        <div class="element">
            <button onclick = "window.open('https://attendencesheet.up.railway.app/','_blank')" class = "button"> Attendence Sheet</button>
        </div>

        <div class = "element">
            <button onclick="window.location.href='/admin/addevent'" class = "button"> Host an Hackathon </button>
        </div>


    </main>
    <script>
    const button = document.getElementById('listbtn');
    const menu = document.getElementById('menu');

    button.addEventListener('click', () => {
        menu.classList.toggle('hidden');
    });
</script>
    

</body>


</html>
