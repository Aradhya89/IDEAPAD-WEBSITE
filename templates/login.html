  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Google</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }

        .login-card {
            width: 350px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 12px;
            color: #202124;
            font-size: 28px;
        }

        p {
            color: #5f6368;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 13px;
            background: white;
            border: 1px solid #dadce0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #3c4043;
            transition: 0.25s;
        }

        .google-btn:hover {
            background: #f8f9fa;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .google-btn img {
            width: 22px;
            height: 22px;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1>Welcome</h1>
    <p>Sign in to continue</p>

    <button class="google-btn" onclick="googleLogin()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Continue with Google
    </button>

    <div class="footer">
        Secure authentication powered by Google
    </div>
</div>

<script>
function googleLogin() {
    // Replace this URL with your backend OAuth endpoint
    window.location.href = "/auth/google";
}
</script>

</body>
</html>
