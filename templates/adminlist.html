    <!DOCTYPE html>
<html>

<head>

    <title>Admin Panel</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            margin:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        th{
            background:#222;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

        img{
            width:45px;
            height:45px;
            border-radius:50%;
        }

    </style>

</head>

<body>

<h2>Total Registrations : {{ registrations|length }}</h2>

<table>

<thead>

<tr>

<th>Photo</th>
<th>Name</th>
<th>Email</th>
<th>Roll No</th>
<th>Batch</th>
<th>Branch</th>
<th>Registered</th>
<th>Updated</th>

</tr>

</thead>

<tbody>

{% for user in registrations %}

<tr>

<td>

<img src="{{ user.profile_picture }}">

</td>

<td>{{ user.full_name }}</td>

<td>{{ user.email }}</td>

<td>{{ user.rollno }}</td>

<td>{{ user.batch }}</td>

<td>{{ user.branch }}</td>

<td>{{ user.registered_at }}</td>

<td>{{ user.updated_at }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</body>

</html>
